---
- name: Deploy Note API
  hosts: local
  become: false

  tasks:
    - name: Pull latest Docker image
      command: docker pull supernutman/note-api:latest

    - name: Stop existing container
      command: docker stop note-api-ansible
      ignore_errors: true

    - name: Remove existing container
      command: docker rm note-api-ansible
      ignore_errors: true

    - name: Run new container
      command: >
        docker run -d
        --name note-api-ansible
        --network note-api_devops-net
        -p 5002:5000
        supernutman/note-api:latest